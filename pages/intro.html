    <!-- Interactive Script -->
    <script>
        function initGuestMeta() {
            const urlParams = new URLSearchParams(window.location.search);
            const guestParam = urlParams.get('to') || urlParams.get('name') || urlParams.get('guest') || urlParams.get('g');
            if (guestParam) {
                let decodedName = '';
                try {
                    const cleaned = guestParam.replace(/\+/g, ' ');
                    decodedName = cleaned.includes('%') ? decodeURIComponent(cleaned) : cleaned;
                } catch (e) {
                    decodedName = guestParam.replace(/\+/g, ' ');
                }
                decodedName = decodedName.trim();
                if (decodedName) {
                    const dynamicDesc = `សូមគោរពអញ្ជើញ ${decodedName} ចូលរួមជាអធិបតី និងជាភ្ញៀវកិត្តិយស ក្នុងពិធីសិរីមង្គលអាពាហ៍ពិពាហ៍ នៅថ្ងៃអាទិត្យ ទី១០ ខែមករា ឆ្នាំ ២០២៧`;
                    const metaDesc = document.querySelector('meta[name="description"]');
                    if (metaDesc) metaDesc.setAttribute('content', dynamicDesc);
                    const ogDesc = document.querySelector('meta[property="og:description"]');
                    if (ogDesc) ogDesc.setAttribute('content', dynamicDesc);
                    const twDesc = document.querySelector('meta[name="twitter:description"]');
                    if (twDesc) twDesc.setAttribute('content', dynamicDesc);
                }
            }
        }

        /* ==========================================================================
           1. 5-SECOND REDIRECT CONTROLLER
           ========================================================================== */
        let remainingSeconds = 5;
        let isRedirecting = false;
        let countdownTimer = null;

        function updateCountdown() {
            const counterEl = document.getElementById('countdown-seconds');
            if (counterEl) {
                counterEl.textContent = remainingSeconds;
            }

            if (remainingSeconds <= 0) {
                directToDetail();
                return;
            }

            remainingSeconds--;
            countdownTimer = setTimeout(updateCountdown, 1000);
        }

        function directToDetail() {
            if (isRedirecting) return;
            isRedirecting = true;
            if (countdownTimer) clearTimeout(countdownTimer);

            // Save audio playback position before redirecting to detail page
            saveAudioPosition();

            // Add smooth exit fade
            document.body.classList.add('page-exit');

            // Preserve search query parameters (e.g., ?to=GuestName)
            const searchParams = window.location.search || '';
            const targetUrl = 'detail_page.html' + searchParams;

            setTimeout(() => {
                saveAudioPosition();
                window.location.replace(targetUrl);
            }, 380);
        }

        // Start countdown once DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            updateCountdown();
            initAudioController();
            initPetals();
            initGuestMeta();

            // Allow tapping anywhere on the cover photo to proceed immediately
            const coverWrapper = document.querySelector('.photo-cover-wrapper');
            if (coverWrapper) {
                coverWrapper.addEventListener('click', directToDetail);
            }
        });

        function initGuestMeta() {
            const urlParams = new URLSearchParams(window.location.search);
            const guestParam = urlParams.get('to') || urlParams.get('name') || urlParams.get('guest') || urlParams.get('g');
            if (guestParam) {
                let decodedName = '';
                try {
                    const cleaned = guestParam.replace(/\+/g, ' ');
                    decodedName = cleaned.includes('%') ? decodeURIComponent(cleaned) : cleaned;
                } catch (e) {
                    decodedName = guestParam.replace(/\+/g, ' ');
                }
                decodedName = decodedName.trim();
                if (decodedName) {
                    const dynamicDesc = `សូមគោរពអញ្ជើញ ${decodedName} ចូលរួមជាអធិបតី និងជាភ្ញៀវកិត្តិយស ក្នុងពិធីសិរីមង្គលអាពាហ៍ពិពាហ៍ នៅថ្ងៃអាទិត្យ ទី១០ ខែមករា ឆ្នាំ ២០២៧`;
                    const metaDesc = document.querySelector('meta[name="description"]');
                    if (metaDesc) metaDesc.setAttribute('content', dynamicDesc);
                    const ogDesc = document.querySelector('meta[property="og:description"]');
                    if (ogDesc) ogDesc.setAttribute('content', dynamicDesc);
                    const twDesc = document.querySelector('meta[name="twitter:description"]');
                    if (twDesc) twDesc.setAttribute('content', dynamicDesc);
                }
            }
        }

        /* ==========================================================================
           2. AUDIO CONTROLLER WITH INTRO & DETAIL CONTINUITY
           ========================================================================== */
        let audio = null;
        let musicToggle = null;

        function initAudioController() {
            audio = document.getElementById('background-music');
            musicToggle = document.getElementById('music-toggle');
            if (!audio || !musicToggle) return;

            // Restore saved playback position from intro or detail page
            restoreAudioPosition();

            const savedState = localStorage.getItem('wedding_music_state');
            // Default to playing since user clicked from index, unless explicitly paused
            if (savedState !== 'paused') {
                playMusic();
            }

            musicToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (audio.paused) {
                    playMusic();
                } else {
                    pauseMusic();
                }
            });

            // Track playback position continuously so it continues where it pause
            audio.addEventListener('timeupdate', () => {
                if (!isNaN(audio.currentTime) && audio.currentTime > 0) {
                    localStorage.setItem('wedding_music_time', audio.currentTime.toFixed(2));
                }
            });

            audio.addEventListener('play', () => {
                musicToggle.classList.add('playing');
                localStorage.setItem('wedding_music_state', 'playing');
            });

            audio.addEventListener('pause', () => {
                musicToggle.classList.remove('playing');
                localStorage.setItem('wedding_music_state', 'paused');
                saveAudioPosition();
            });

            audio.addEventListener('ended', () => {
                localStorage.setItem('wedding_music_time', '0');
            });

            // Save exact position on page exit / unload
            window.addEventListener('pagehide', saveAudioPosition);
            window.addEventListener('beforeunload', saveAudioPosition);

            // Fallback unlock on first touch
            const unlockAudio = () => {
                if (audio && audio.paused && localStorage.getItem('wedding_music_state') !== 'paused') {
                    playMusic();
                }
                document.removeEventListener('click', unlockAudio);
                document.removeEventListener('touchstart', unlockAudio);
            };
            document.addEventListener('click', unlockAudio, { once: true });
            document.addEventListener('touchstart', unlockAudio, { once: true });
        }

        function restoreAudioPosition() {
            if (!audio) return;
            const savedTime = parseFloat(localStorage.getItem('wedding_music_time'));
            if (savedTime && !isNaN(savedTime) && isFinite(savedTime) && savedTime > 0) {
                const applyTime = () => {
                    try {
                        if (!audio.duration || savedTime < audio.duration) {
                            audio.currentTime = savedTime;
                        }
                    } catch (err) {
                        console.log("Could not set currentTime yet:", err);
                    }
                };

                if (audio.readyState >= 1) {
                    applyTime();
                } else {
                    audio.addEventListener('loadedmetadata', applyTime, { once: true });
                    audio.addEventListener('canplay', applyTime, { once: true });
                }
            }
        }

        function saveAudioPosition() {
            if (audio && !isNaN(audio.currentTime) && audio.currentTime > 0) {
                localStorage.setItem('wedding_music_time', audio.currentTime.toFixed(2));
            }
        }

        function playMusic() {
            if (!audio) return;
            restoreAudioPosition();
            audio.play().then(() => {
                if (musicToggle) musicToggle.classList.add('playing');
                localStorage.setItem('wedding_music_state', 'playing');
                restoreAudioPosition();
            }).catch(err => {
                console.log("Audio play allowed on user interaction:", err);
            });
        }

        function pauseMusic() {
            if (!audio) return;
            audio.pause();
            saveAudioPosition();
            if (musicToggle) musicToggle.classList.remove('playing');
            localStorage.setItem('wedding_music_state', 'paused');
        }

        function initGuestMeta() {
            const urlParams = new URLSearchParams(window.location.search);
            const guestParam = urlParams.get('to') || urlParams.get('name') || urlParams.get('guest') || urlParams.get('g');
            if (guestParam) {
                let decodedName = '';
                try {
                    const cleaned = guestParam.replace(/\+/g, ' ');
                    decodedName = cleaned.includes('%') ? decodeURIComponent(cleaned) : cleaned;
                } catch (e) {
                    decodedName = guestParam.replace(/\+/g, ' ');
                }
                decodedName = decodedName.trim();
                if (decodedName) {
                    const dynamicDesc = `សូមគោរពអញ្ជើញ ${decodedName} ចូលរួមជាអធិបតី និងជាភ្ញៀវកិត្តិយស ក្នុងពិធីសិរីមង្គលអាពាហ៍ពិពាហ៍ នៅថ្ងៃអាទិត្យ ទី១០ ខែមករា ឆ្នាំ ២០២៧`;
                    const metaDesc = document.querySelector('meta[name="description"]');
                    if (metaDesc) metaDesc.setAttribute('content', dynamicDesc);
                    const ogDesc = document.querySelector('meta[property="og:description"]');
                    if (ogDesc) ogDesc.setAttribute('content', dynamicDesc);
                    const twDesc = document.querySelector('meta[name="twitter:description"]');
                    if (twDesc) twDesc.setAttribute('content', dynamicDesc);
                }
            }
        }

        /* ==========================================================================
           3. FLOATING PETALS CANVAS
           ========================================================================== */
        function initPetals() {
            const canvas = document.getElementById('petals-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const petalCount = window.innerWidth < 768 ? 20 : 32;
            const petals = [];

            const petalColors = [
                'rgba(245, 230, 185, 0.8)', // gold leaf
                'rgba(255, 250, 240, 0.85)', // ivory cream
                'rgba(195, 230, 205, 0.7)',  // emerald petal
                'rgba(240, 215, 155, 0.75)'  // champagne gold
            ];

            class Petal {
                constructor() {
                    this.reset(true);
                }

                reset(initial = false) {
                    this.x = Math.random() * width;
                    this.y = initial ? Math.random() * height : -20;
                    this.size = Math.random() * 8 + 6;
                    this.speedY = Math.random() * 1.2 + 0.7;
                    this.speedX = Math.random() * 0.8 - 0.4;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.025;
                    this.oscillationSpeed = Math.random() * 0.02 + 0.01;
                    this.angle = Math.random() * Math.PI * 2;
                    this.color = petalColors[Math.floor(Math.random() * petalColors.length)];
                }

                update() {
                    this.angle += this.oscillationSpeed;
                    this.y += this.speedY;
                    this.x += Math.sin(this.angle) * 0.8 + this.speedX;
                    this.rotation += this.rotationSpeed;

                    if (this.y > height + 20 || this.x < -20 || this.x > width + 20) {
                        this.reset();
                    }
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.fillStyle = this.color;

                    ctx.beginPath();
                    ctx.moveTo(0, -this.size);
                    ctx.bezierCurveTo(this.size * 0.8, -this.size * 0.5, this.size * 0.6, this.size * 0.6, 0, this.size);
                    ctx.bezierCurveTo(-this.size * 0.6, this.size * 0.6, -this.size * 0.8, -this.size * 0.5, 0, -this.size);
                    ctx.fill();

                    ctx.restore();
                }
            }

            for (let i = 0; i < petalCount; i++) {
                petals.push(new Petal());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                petals.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
